name: Releases lib

on:
  workflow_dispatch:

jobs:
  releases-core:
    runs-on: ubuntu-latest
    container: node:24
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: npm install --global bun
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: |
          cd dist
          npm publish --access public

  # Publish the docs for the commit that was just released.
  docs:
    needs: releases-core
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
